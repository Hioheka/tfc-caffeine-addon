name: Build Mod JAR

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Download and setup Gradle 2.0
      run: |
        wget https://services.gradle.org/distributions/gradle-2.0-bin.zip
        unzip -q gradle-2.0-bin.zip
        echo "$GITHUB_WORKSPACE/gradle-2.0/bin" >> $GITHUB_PATH

    - name: Setup Gradle Wrapper manually
      run: |
        mkdir -p gradle/wrapper
        wget https://raw.githubusercontent.com/gradle/gradle/v2.0.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
        wget https://raw.githubusercontent.com/gradle/gradle/v2.0.0/gradlew
        wget https://raw.githubusercontent.com/gradle/gradle/v2.0.0/gradlew.bat
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-2.0-bin.zip
        EOF
        chmod +x gradlew

    - name: Setup Decompile Workspace
      run: ./gradlew setupDecompWorkspace --no-daemon --stacktrace

    - name: Build with Gradle
      run: ./gradlew build --no-daemon --stacktrace

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: teaaddon-jar
        path: build/libs/*.jar
        retention-days: 90

    - name: List build output
      run: ls -lh build/libs/
