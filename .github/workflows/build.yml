name: Build Mod JAR

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Download and setup Gradle 2.0
      run: |
        wget https://services.gradle.org/distributions/gradle-2.0-bin.zip
        unzip -q gradle-2.0-bin.zip
        chmod +x gradle-2.0/bin/gradle

    - name: Setup Decompile Workspace
      run: ./gradle-2.0/bin/gradle setupDecompWorkspace --no-daemon --stacktrace

    - name: Build with Gradle
      run: ./gradle-2.0/bin/gradle build --no-daemon --stacktrace

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: teaaddon-jar
        path: build/libs/*.jar
        retention-days: 90

    - name: List build output
      run: ls -lh build/libs/
