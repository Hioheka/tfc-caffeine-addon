name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Decompile Workspace
      run: ./gradlew setupDecompWorkspace --no-daemon

    - name: Build with Gradle
      run: ./gradlew build --no-daemon

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: build/libs/*.jar
        name: Tea Addon ${{ steps.get_version.outputs.VERSION }}
        body: |
          ## Tea Addon for TerraFirmaCraft

          **Minecraft Version:** 1.7.10
          **Forge Version:** 10.13.4.1614-1558
          **TFC Version:** 0.79.29.922

          ### Installation
          1. Download the JAR file below
          2. Place it in your `.minecraft/mods/` folder
          3. Make sure TerraFirmaCraft is installed
          4. Launch Minecraft with Forge

          ### What's Included
          - Tea Seeds (plantable item)
          - Tea Plant (8 growth stages)
          - Tea Leaves (food item)
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
