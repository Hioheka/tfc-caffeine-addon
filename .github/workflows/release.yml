name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Download dependencies
      run: |
        mkdir -p libs
        # Download Minecraft Forge 1.7.10 dev
        wget https://maven.minecraftforge.net/net/minecraftforge/forge/1.7.10-10.13.4.1614-1.7.10/forge-1.7.10-10.13.4.1614-1.7.10-dev.jar -O libs/forge.jar
        # Download TFC dev
        wget https://maven.dries007.net/com/bioxx/tfc/TerraFirmaCraft/0.79.29.922/TerraFirmaCraft-0.79.29.922-dev.jar -O libs/tfc.jar

    - name: Compile Java sources
      run: |
        mkdir -p build/classes
        find src/main/java -name "*.java" > sources.txt
        javac -cp "libs/*" -d build/classes @sources.txt

    - name: Build JAR
      run: |
        # Copy resources
        cp -r src/main/resources/* build/classes/ 2>/dev/null || true
        # Update mcmod.info version
        sed -i "s/\${version}/1.0.0/g" build/classes/mcmod.info
        sed -i "s/\${mcversion}/1.7.10/g" build/classes/mcmod.info
        # Create JAR
        mkdir -p build/libs
        cd build/classes
        jar cf ../libs/teaaddon-1.0.0.jar .
        cd ../..
        ls -lh build/libs/

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: build/libs/*.jar
        name: Tea Addon ${{ steps.get_version.outputs.VERSION }}
        body: |
          ## Tea Addon for TerraFirmaCraft

          **Minecraft Version:** 1.7.10
          **Forge Version:** 10.13.4.1614-1558
          **TFC Version:** 0.79.29.922

          ### Installation
          1. Download the JAR file below
          2. Place it in your `.minecraft/mods/` folder
          3. Make sure TerraFirmaCraft is installed
          4. Launch Minecraft with Forge

          ### What's Included
          - Tea Seeds (plantable item)
          - Tea Plant (8 growth stages)
          - Tea Leaves (food item)
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
