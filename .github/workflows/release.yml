name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Download and setup Gradle 2.0
      run: |
        wget https://services.gradle.org/distributions/gradle-2.0-bin.zip
        unzip -q gradle-2.0-bin.zip
        chmod +x gradle-2.0/bin/gradle

    - name: Fix Minecraft asset URLs
      run: |
        mkdir -p $HOME/.gradle/caches/minecraft/net/minecraft/
        mkdir -p $HOME/.gradle/caches/minecraft/assets/indexes/
        # Download from new launcher manifest URLs
        wget https://launchermeta.mojang.com/v1/packages/8a9d6d825321efe1e753a1f9509e7e0c9c5b823b/1.7.10.json -O $HOME/.gradle/caches/minecraft/net/minecraft/1.7.10/1.7.10.json || true
        wget https://launchermeta.mojang.com/v1/packages/dd78f31e8e37c4d4e79724a0cec84a3a45a847c9/1.7.10.json -O $HOME/.gradle/caches/minecraft/assets/indexes/1.7.10.json || true

    - name: Setup Decompile Workspace
      run: ./gradle-2.0/bin/gradle setupDecompWorkspace --no-daemon --stacktrace --refresh-dependencies

    - name: Build with Gradle
      run: ./gradle-2.0/bin/gradle build --no-daemon --stacktrace

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: build/libs/*.jar
        name: Tea Addon ${{ steps.get_version.outputs.VERSION }}
        body: |
          ## Tea Addon for TerraFirmaCraft

          **Minecraft Version:** 1.7.10
          **Forge Version:** 10.13.4.1614-1558
          **TFC Version:** 0.79.29.922

          ### Installation
          1. Download the JAR file below
          2. Place it in your `.minecraft/mods/` folder
          3. Make sure TerraFirmaCraft is installed
          4. Launch Minecraft with Forge

          ### What's Included
          - Tea Seeds (plantable item)
          - Tea Plant (8 growth stages)
          - Tea Leaves (food item)
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
