name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Download and setup Gradle 2.0
      run: |
        wget https://services.gradle.org/distributions/gradle-2.0-bin.zip
        unzip -q gradle-2.0-bin.zip
        echo "$GITHUB_WORKSPACE/gradle-2.0/bin" >> $GITHUB_PATH

    - name: Setup Gradle Wrapper manually
      run: |
        mkdir -p gradle/wrapper
        wget https://raw.githubusercontent.com/gradle/gradle/v2.0.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
        wget https://raw.githubusercontent.com/gradle/gradle/v2.0.0/gradlew
        wget https://raw.githubusercontent.com/gradle/gradle/v2.0.0/gradlew.bat
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-2.0-bin.zip
        EOF
        chmod +x gradlew

    - name: Setup Decompile Workspace
      run: ./gradlew setupDecompWorkspace --no-daemon --stacktrace

    - name: Build with Gradle
      run: ./gradlew build --no-daemon --stacktrace

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: build/libs/*.jar
        name: Tea Addon ${{ steps.get_version.outputs.VERSION }}
        body: |
          ## Tea Addon for TerraFirmaCraft

          **Minecraft Version:** 1.7.10
          **Forge Version:** 10.13.4.1614-1558
          **TFC Version:** 0.79.29.922

          ### Installation
          1. Download the JAR file below
          2. Place it in your `.minecraft/mods/` folder
          3. Make sure TerraFirmaCraft is installed
          4. Launch Minecraft with Forge

          ### What's Included
          - Tea Seeds (plantable item)
          - Tea Plant (8 growth stages)
          - Tea Leaves (food item)
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
