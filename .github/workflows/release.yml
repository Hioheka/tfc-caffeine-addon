name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Setup Gradle Wrapper files
      run: |
        mkdir -p gradle/wrapper
        # Download gradle-wrapper.jar from Maven Central
        wget https://raw.githubusercontent.com/gradle/gradle/v2.0.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
        # Create gradlew script
        cat > gradlew << 'GRADLEW_EOF'
#!/usr/bin/env bash
GRADLE_APP_NAME="Gradle"
CLASSPATH=gradle/wrapper/gradle-wrapper.jar
exec java -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
GRADLEW_EOF
        chmod +x gradlew
        # Verify files
        ls -la gradle/wrapper/
        ls -la gradlew

    - name: Setup CI Workspace
      run: ./gradlew setupCIWorkspace --no-daemon --stacktrace || echo "Setup had issues, continuing..."

    - name: Build JAR
      run: ./gradlew build --no-daemon --stacktrace

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: build/libs/*.jar
        name: Tea Addon ${{ steps.get_version.outputs.VERSION }}
        body: |
          ## Tea Addon for TerraFirmaCraft

          **Minecraft Version:** 1.7.10
          **Forge Version:** 10.13.4.1614-1558
          **TFC Version:** 0.79.29.922

          ### Installation
          1. Download the JAR file below
          2. Place it in your `.minecraft/mods/` folder
          3. Make sure TerraFirmaCraft is installed
          4. Launch Minecraft with Forge

          ### What's Included
          - Tea Seeds (plantable item)
          - Tea Plant (8 growth stages)
          - Tea Leaves (food item)
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
